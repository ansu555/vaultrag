[project]
name = "vaultrag"
version = "0.1.0"
description = "Self-hosted, MCP-first RAG backend over Obsidian vaults."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anik" }]
keywords = ["rag", "mcp", "obsidian", "retrieval", "embeddings", "qdrant", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    # Real key hashing (P3 Stage 5), replacing Stage 4's compare_digest bootstrap.
    # Weighed before committing, the way FastAPI/Docling/prometheus-client were:
    # +2 packages / ~120 KB (argon2 28 KB, its cffi bindings 90 KB) — cffi and pycparser
    # were already resolved transitively (qdrant-client's grpc stack), so they cost
    # nothing new. No credible lighter option hashes passwords correctly: bcrypt truncates
    # input past 72 bytes and PBKDF2 has no memory-hardness, so this is the base, not an extra.
    "argon2-cffi>=25.1.0",
    "blake3>=1.0.9",
    # The REST transport (P3 Stage 4). Weighed before committing, the way Docling and
    # prometheus-client were: FastAPI adds **1 package / 904 KB** and nothing else,
    # because starlette, uvicorn, pydantic and anyio are already installed as fastmcp's
    # own dependencies — `serve` reuses the ASGI stack the MCP http transport ships. The
    # weight that made Docling an extra simply isn't here, so this belongs in the base.
    "fastapi>=0.115",
    "fastembed>=0.5",
    "fastmcp>=3.4.4",
    "httpx>=0.27",
    "huggingface-hub>=0.26",
    # Obsidian's Excalidraw plugin stores scenes as LZ-string-compressed base64
    # (`compressed-json` fences). Pure Python, MIT, no transitive deps — a port of
    # pieroxy's lz-string, verified byte-compatible with the JS implementation in
    # both directions (tests/test_excalidraw.py pins a JS-produced blob).
    "lzstring>=1.0.4",
    "markdown-it-py>=4.2.0",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "pathspec>=1.1.1",
    # The /metrics exporter (P2 Stage 7). Pure Python, zero transitive dependencies —
    # unlike Docling it costs nothing to put in the base install, so observability is
    # always available rather than an extra someone forgets to enable before an incident.
    "prometheus-client>=0.21",
    "pydantic-settings>=2.5",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.12",
    "structlog>=24.4",
    "tokenizers>=0.20",
    "typer>=0.12",
    # Declared explicitly although fastmcp already pulls it (0 new packages): `serve`
    # imports uvicorn directly, and depending on another package's transitive is how an
    # upstream dependency change breaks a command that never mentioned it.
    "uvicorn>=0.30",
    "watchdog>=4.0",
]

[project.urls]
Homepage = "https://github.com/ansu555/vaultrag"
Repository = "https://github.com/ansu555/vaultrag"
Issues = "https://github.com/ansu555/vaultrag/issues"

# Docling pulls ~100 packages including torch — far too heavy for the base install
# (local-first, principle #2), so PDF support is opt-in: `uv sync --extra pdf`.
# Without it, PDFs are skipped cleanly and the rest of the vault still indexes.
# See ../Rag/projects/vaultrag/p2-step-plan.md Decision 3.
[project.optional-dependencies]
pdf = ["docling>=2.114"]

[project.scripts]
vaultrag = "vaultrag.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultrag"]

# --- lint / format -----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# start strict-ish; expand as the codebase grows.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

# --- type checking -----------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

# Reranker ML stack ships no type information (loaded lazily in retrieval/rerank.py).
# `lzstring` (Excalidraw `compressed-json`, P2 Stage 5) ships none either.
#
# `docling` is here for a different reason: it is an *optional extra*, imported lazily in
# parsing/pdf.py, so on a base install (`uv sync` with no `--extra pdf`) mypy cannot resolve
# it and fails — which is exactly what CI runs. This suppresses only the *missing* case; when
# the extra is installed mypy still type-checks against the real package.
[[tool.mypy.overrides]]
module = [
    "docling",
    "docling.*",
    "onnxruntime",
    "onnxruntime.*",
    "rapidocr",
    "rapidocr.*",
    "pytesseract",
    "tokenizers",
    "tokenizers.*",
    "huggingface_hub",
    "lzstring",
]
ignore_missing_imports = true

# --- tests -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
